<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>جعبه لایتنر – تعاریف</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1f1e;--mute:#68706d;--line:#e2e0d9;--accent:#1f6f5c;--accent-ink:#fff;--ok:#2e7d4f;--bad:#b3392f;--soft:#e9f2ef;}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1d2120;--ink:#ecefed;--mute:#9aa4a0;--line:#2c3331;--accent:#4fb99f;--accent-ink:#0c1a16;--ok:#58c186;--bad:#e07a70;--soft:#1f2c28;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn","Vazir",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.7}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
header{padding:12px 16px 4px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top h1{font-size:18px;margin:0}
.mute{color:var(--mute);font-size:13px}
.boxes{display:flex;gap:6px;margin-top:8px}
.bx{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 0;text-align:center;font-size:12px;color:var(--mute)}
.bx b{display:block;font-size:16px;color:var(--ink)}
main{padding:8px 16px 16px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:14px 4px;font-size:14px;color:var(--mute)}
nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.filterbar{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--soft);border:0;border-radius:10px;padding:8px 12px;font-size:14px;text-align:right;margin-bottom:10px}
.filterbar b{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;min-height:46vh;display:flex;flex-direction:column}
.card.tap{cursor:pointer}
.tag{font-size:12px;color:var(--mute);margin-bottom:6px}
.term{font-size:28px;font-weight:700;line-height:1.5;text-align:center;margin:14px 0 6px}
.en{direction:ltr;text-align:center;color:var(--mute);font-size:18px;margin-bottom:10px}
.def{white-space:pre-line;font-size:17px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.where{margin-top:18px;font-size:14px}
.where div:first-child{font-weight:600;color:var(--accent)}
.hint{margin-top:auto;padding-top:24px;text-align:center;color:var(--mute);font-size:14px}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff}
.actions .good{background:var(--ok)}.actions .bad{background:var(--bad)}
.src{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srchead{width:100%;display:flex;justify-content:space-between;background:none;border:0;padding:12px 14px;font-weight:600;text-align:right}
.srcbody{padding:0 14px 14px;font-size:14px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:10px 16px;font-weight:700}
.btn.ghost{background:var(--soft);color:var(--ink);font-weight:600}
.btn.warn{background:var(--bad);color:#fff}
.lrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.lrow.on{border-color:var(--accent);background:var(--soft)}
.dot{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none}
.lrow.on .dot{background:var(--accent);border-color:var(--accent)}
.lrow .grow{flex:1}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px}
.seg button.on{background:var(--card);font-weight:700}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 2px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{min-height:140px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.badge{font-size:12px;background:var(--soft);border-radius:8px;padding:2px 8px;color:var(--mute);flex:none}
.item button{border:0;background:none;color:var(--bad);font-size:13px;padding:6px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:88%;text-align:center;display:none;z-index:9}
.center{text-align:center;padding:40px 12px}
</style>
</head>
<body>
<header><div class="top"><h1>جعبه لایتنر</h1><span class="mute" id="tot"></span></div><div class="boxes" id="boxes"></div></header>
<main id="view"></main>
<nav id="nav">
  <button data-go="study">مطالعه</button>
  <button data-go="filter">دروس</button>
  <button data-go="add">افزودن</button>
  <button data-go="cards">کارت‌ها</button>
</nav>
<div id="toast"></div>
<script>

زیع‌شده را شیوه‌ای دیگر برای اندیشیدن به عمل رهبری می‌داند که در تعاملات میان رهبران، پیروان و ابزارها و مصنوعات نمادین موقعیت «کشیده» می‌شود، نه در نقش‌ها و ویژگی‌های فردی افراد در سمت‌های رسمی.", "s": "Spillane, J. P. (2006). Distributed Leadership.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "رهبری خدمتگزار", "e": "Servant Leadership", "d": "گرین‌لیف رهبری خدمتگزار را رویکردی می‌داند که در آن رهبر ابتدا خدمت می‌کند و سپس هدایت می‌کند؛ تمرکز اصلی آن بر رشد و رفاه پیروان و اجتماع است، نه بر قدرت یا اقتدار رهبر.", "s": "Greenleaf, R. K. (1977). Servant Leadership.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "رهبری معنوی", "e": "Spiritual Leadership", "d": "فرای (۲۰۰۳) رهبری معنوی را نظریه‌ای می‌داند که شامل ارزش‌ها، نگرش‌ها و رفتارهایی است که برای انگیزش درونی خود و دیگران به‌طور معناداری لازم است تا احساس بقای معنوی از طریق فراخوانی و عضویت به‌دست آید.", "s": "Fry, L. W. (2003), Toward a Theory of Spiritual Leadership, The Leadership Quarterly, 14(6), 693.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "سه ضلع آموزش", "e": "The Three Pillars of Education", "d": "راهبری سه ضلع آموزش وظیفه مدیرت آموزشی است. 1-منابع مالی 2-منابع فیزیکی (مثل ساختمان) 3-منابع انسانی", "s": "", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "فراتحلیل", "e": "Meta-analysis", "d": "روشی کمّی-آماری برای ترکیب نتایج عددی چندین مطالعهٔ مستقل (معمولاً پژوهش‌های کمّی) دربارهٔ یک موضوع واحد، به‌منظور برآورد اندازهٔ اثر کلی و افزایش دقت و تعمیم‌پذیری نتایج.", "s": "Glass, G. V. (1976). Primary, Secondary, and Meta-Analysis of Research. Educational Researcher, 5(10), 3–8.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "فراترکیب", "e": "Meta-synthesis", "d": "روشی کیفی برای تفسیر و تلفیق نظام‌مند یافته‌های چندین مطالعهٔ کیفی مرتبط، به‌منظور دستیابی به تبیینی جامع‌تر و عمیق‌تر از یک پدیده.", "s": "Sandelowski, M., & Barroso, J. (2007). Handbook for Synthesizing Qualitative Research. Springer.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "فرایند تبدیل واژه به قانون", "e": "Process of turning a term into a law", "d": "فرایند تبدیل واژه به قانون؛ مراحل هفت‌گانه\n۱. واژه (Term)\nنقطهٔ آغاز، انتخاب یک واژه برای اشاره به پدیده‌ای مشخص است؛ مانند «رهبری»، «انگیزش» یا «بهره‌وری». در این مرحله، فقط نام پدیده را مشخص می‌کنیم.\n۲. مفهوم‌سازی (Conceptualization)\nمعنای دقیق واژه تعیین می‌شود تا مشخص شود آن واژه به چه پدیده‌ای اشاره دارد و چه تفاوتی با مفاهیم مشابه دارد. برای مثال، رهبری با مدیریت یکسان نیست.\n۳. تعریف عملیاتی (Operational Definition)\nمشخص می‌کنیم مفهوم موردنظر چگونه قابل مشاهده یا اندازه‌گیری است. برای مثال، می‌توان برخی ابعاد رهبری آموزشی را با رفتارهای مدیر، مشارکت معلمان و حمایت از یادگیری بررسی کرد.\n۴. مشاهده و گردآوری شواهد (Observation and Data Collection)\nاطلاعات مرتبط از طریق مشاهده، پرسش‌نامه، مصاحبه یا پژوهش‌های علمی گردآوری می‌شوند تا مشخص شود پدیده در واقعیت چگونه رخ می‌دهد.\n۵. فرضیه‌سازی و شناسایی الگوها (Hypothesis Formation and Pattern Identification)\nپژوهشگر بر اساس شواهد، فرضیه‌ای دربارهٔ رابطهٔ میان پدیده‌ها مطرح می‌کند و به دنبال الگوهای تکرارشونده است؛ برای مثال، رابطهٔ حمایت مدیر با مشارکت معلمان.\n۶. آزمون، تکرار و اعتبارسنجی (Testing, Replication and Validation)\nفرضیه با داده‌های جدید، روش‌های مناسب و پژوهش‌های مستقل بررسی می‌شود. اگر شواهد کافی نباشند، فرضیه باید اصلاح یا رد شود.\n۷. صورت‌بندی قانون علمی (Scientific Law Formulation)\nاگر رابطه‌ای مشخص به‌طور پایدار و در شرایط معین با شواهد معتبر تأیید شود، ممکن است بتوان آن را به شکل یک قانون توصیفی بیان کرد. بااین‌حال، همهٔ مفاهیم یا فرضیه‌ها به قانون علمی منتهی نمی‌شوند.", "s": "تعریف آموزشی تلفیقی؛ برای انطباق با صورت‌بندی خاص استاد، جزوهٔ درس مرجع نهایی است. برای تمایز نظریه و قانون: National Academies of Sciences, Engineering, and Medicine (2019), Science and Engineering for Grades 6–12.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "فلسفه", "e": "Philosophy", "d": "فلسفه، مطالعهٔ نظام‌مند و نقادانهٔ پرسش‌های بنیادین دربارهٔ واقعیت، شناخت، ارزش‌ها و شیوهٔ درست اندیشیدن و عمل کردن است. در آموزش و رهبری، فلسفه مبانی ارزشی و فکری تصمیم‌ها و اهداف را روشن می‌کند.", "s": "Blackburn, S. (2008). The Oxford Dictionary of Philosophy (2nd ed.). Oxford University Press.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "فلسفه در مدیریت", "e": "Philosophy in management", "d": "فلسفه در مدیریت به بررسی و روشن‌سازی باورها، ارزش‌ها و مفروضاتی گفته می‌شود که بر تعریف مسئله، تصمیم‌گیری، رفتار مدیر و رابطهٔ سازمان با افراد و جامعه اثر می‌گذارند.", "s": "تعریف تلفیقی بر پایهٔ مباحث فلسفهٔ مدیریت و اخلاق سازمانی.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "فلسفه مدیریت", "e": "Management philosophy", "d": "فلسفهٔ مدیریت مجموعه‌ای نسبتاً منسجم از باورها و ارزش‌های راهنماست که تعیین می‌کند مدیر سازمان را چگونه می‌فهمد، با کارکنان چگونه رفتار می‌کند و اهداف و تصمیم‌ها را بر چه مبنایی انتخاب می‌کند.", "s": "تعریف تلفیقی؛ قابل تطبیق با مبانی نظری درس.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "کارآیی", "e": "Efficiency", "d": "کارآیی به نسبت میان منابع مصرف‌شده و ستانده‌های حاصل اشاره دارد؛ کارآیی بیشتر یعنی دستیابی به ستاندهٔ معین با منابع کمتر، یا تولید ستاندهٔ بیشتر با منابع یکسان، بدون آن‌که به‌تنهایی کیفیت تحقق هدف را تضمین کند.", "s": "OECD. (2002). Glossary of Key Terms in Evaluation and Results Based Management.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "مأموریت", "e": "Mission", "d": "مأموریت، بیان فشرده‌ای از دلیل وجودی سازمان، مخاطبان یا ذی‌نفعان اصلی، خدمات یا ارزش‌آفرینی آن و حوزهٔ فعالیتی است که سازمان برای آن مسئولیت می‌پذیرد.", "s": "Bryson, J. M. (2018). Strategic Planning for Public and Nonprofit Organizations (5th ed.). Wiley.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "مدیریت", "e": "Management", "d": "فرایند برنامه‌ریزی، سازمان‌دهی، هدایت و کنترل منابع و فعالیت‌ها برای دستیابی به اهداف سازمانی؛ به‌گونه‌ای که استفاده از منابع و تحقق اهداف مورد توجه قرار گیرد.", "s": "Robbins, S. P., & Coulter, M. (2018). Management (14th ed.). Pearson.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "مدیریت آموزشی (تعریف دوم)", "e": "Educational Management", "d": "مدیریت آموزشی فرایندی است که طی آن منابع انسانی، مالی و مادی سازمان آموزشی برای دستیابی مؤثر و کارآمد به اهداف یادگیری، سازمان‌دهی، هدایت، انگیزش و کنترل می‌شوند.", "s": "Okumbe, J. A. O. (1998). Educational Management: Theory and Practice. Nairobi University Press.", "l": "نظریه‌های رهبری آموزشی", "c": "نظریه‌های رهبری آموزشی"}, {"w": "ویژگی‌های علم سیاست‌گذاری", "e": "", "d": "سه ویژگی دارد:\n1- چند رشته ای است. به عبارت دیگر به کمک رشته های جامعه شناسی، اقتصاد، حقوق، روانشناسی و علوم سیاسی شکل گرفته است.\nبه دنبال حل مشکل است. به عبارت دیکر، هدف این علم حل مسائل عمومی جامعه می‌باشد\n3- هنجاری است. به عبارت دیگر، به شدت تحت تأنیر ارزش‌ها و هنجارهای جامعه قرار دارد.", "s": "دکتر جهانیان", "l": "سیاست‌گذاری آموزشی", "c": "سیاست‌گذاری آموزشی"}, {"w": "تفکر همگرا", "e": "", "d": "فقط یک راه حل برای مسئله وجود دارد.", "s": "دکتر جهانیان", "l": "سیاست‌گذاری آموزشی", "c": "سیاست‌گذاری آموزشی"}, {"w": "تفکر واگرا", "e": "", "d": "برای مسئله چندین راه حل وجود دارد.", "s": "دکتر جهانیان", "l": "سیاست‌گذاری آموزشی", "c": "سیاست‌گذاری آموزشی"}, {"w": "ارزش یک کنفرانس، رساله و مقاله", "e": "", "d": "ارزش یک کنفرانس، رساله و مقاله و کتاب به منابع است. به عبارت دیگر، منابع مورد استفاده می‌باید: \n1- متنوع (در بر گیرنده نشریات علمی، مقالات، کتاب‌ها و پایان‌نامه‌ها)و متکثر (مثلاً 50 منبع) باشند.\n2- منابع به روز باشند.\n3- منابع به روش APAگزارش شوند.", "s": "دکتر جهانیان", "l": "سیاست‌گذاری آموزشی", "c": "سیاست‌گذاری آموزشی"}, {"w": "روش APA", "e": "", "d": "مؤسسه روانشناسی آمریکا (American psycology association) میگوید هر منبعی را که استفاده کردیم با ید 2 جا ارجاع دهیم:\n1- ارجاع درون متنی: بعد از پاراگراف پرانتز باز میشود (نام خانوادگی، تاریخ چاپ)\n2- ارجاع در پایان رساله یا پایان نامه:\n 2-1 کتاب: نام خانوادگی، نام (تاریخ) نام کتاب، اسم شهر، انتشارات\nجهانیان، رمضان (1390) توانمند سازی مدیران، کرج، انتشارات دانشگاه آزاد اسلامی واحد کرک\n2-2 مقاله: نام خانوادگی، نام (تارخ سال) اسم مقاله، اسم مجله، شماره مجله، ضشماره صفحه\n2-3 رساله دکترا یا پایان نامه: جهانیان، رمضان (1385) طراحی الگوی توانمندسازی مدیران مدارس کشور، رساله دکترای تخصصی رشته مدیریت آموزش، دانشگاه آزاد اسلامی واح علوم و تحقیقات تهران", "s": "دکتر جهانیان", "l": "سیاست‌گذاری آموزشی", "c": "سیاست‌گذاری آموزشی"}];
const INT={1:0,2:1,3:3,4:7,5:15};
const DAY=864e5, KEY='leitner_defs_v1';
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.cards)return o;}}catch(e){}
  return {cards:DATA.map((x,i)=>Object.assign({id:'s'+i},x)),prog:{},filter:[]};}
let S=load(),Q=[],stage=0,srcOpen=false,tab='study',addMode='single',delId=null,resetArm=false,search='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fa=n=>Number(n).toLocaleString('fa-IR');
const lessonOf=c=>c.l||'بدون درس';
const P=c=>S.prog[c.id]||{b:1,due:0};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
function pool(){const f=S.filter;return S.cards.filter(c=>!f.length||f.includes(lessonOf(c)));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(ahead){
  const now=Date.now();let p=pool();
  if(!ahead)p=p.filter(c=>P(c).due<=now);
  shuffle(p);
  p.sort(ahead?(a,b)=>P(a).due-P(b).due:(a,b)=>P(a).b-P(b).b);
  Q=p.map(c=>c.id);stage=0;srcOpen=false;
}
const cur=()=>Q.length?S.cards.find(c=>c.id===Q[0]):null;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600);}

function renderHeader(){
  const cnt=[0,0,0,0,0,0];S.cards.forEach(c=>cnt[P(c).b]++);
  $('#boxes').innerHTML=[1,2,3,4,5].map(i=>`<div class="bx"><b>${fa(cnt[i])}</b>جعبه ${fa(i)}</div>`).join('');
  $('#tot').textContent=fa(S.cards.length)+' کارت';
}
function viewStudy(){
  const fl=S.filter.length?S.filter.join('، '):'همه دروس';
  let h=`<button class="filterbar" data-go="filter"><span>فیلتر: <b>${esc(fl)}</b></span><span class="mute">${fa(Q.length)} کارت در صف</span></button>`;
  const c=cur();
  if(!c){
    const p=pool();
    if(!p.length){h+=`<div class="center">در این فیلتر کارتی وجود ندارد.</div>`;}
    else{
      const next=Math.min(...p.map(x=>P(x).due));
      const days=Math.max(1,Math.ceil((next-Date.now())/DAY));
      h+=`<div class="center"><p><b>مرور این بخش تمام شد.</b></p><p class="mute">کارت بعدی حدود ${fa(days)} روز دیگر نوبت مرور دارد.</p><button class="btn ghost" data-act="ahead">مرور زودتر از موعد</button></div>`;
    }
    return h;
  }
  const b=P(c).b;
  let hint='';
  if(stage===0)hint=c.e?'برای دیدن معنی انگلیسی لمس کنید':'برای دیدن تعریف لمس کنید';
  else if(stage===1)hint='برای دیدن تعریف دوباره لمس کنید';
  h+=`<section class="card ${stage<2?'tap':''}" data-act="card"><div class="tag">جعبه ${fa(b)}</div><div class="term">${esc(c.w)}</div>`;
  if(stage>=1&&c.e)h+=`<div class="en">${esc(c.e)}</div>`;
  if(stage>=2)h+=`<div class="def">${esc(c.d)}</div><div class="where"><div>${esc(c.l||'—')}</div><div class="mute">${esc(c.c||'')}</div></div>`;
  else h+=`<div class="hint">${hint}</div>`;
  h+=`</section>`;
  if(stage>=2){
    h+=`<div class="actions"><button class="bad" data-act="no">نمی‌دانستم</button><button class="good" data-act="yes">می‌دانستم</button></div>`;
    h+=`<div class="src"><button class="srchead" data-act="src"><span>توضیح تکمیل</span><span>${srcOpen?'▴':'▾'}</span></button>${srcOpen?`<div class="srcbody">${esc(c.s||'منبعی ثبت نشده است.')}</div>`:''}</div>`;
  }
  return h;
}
function answer(ok){
  const c=cur();if(!c)return;
  const b=ok?Math.min(5,P(c).b+1):1;
  S.prog[c.id]={b:b,due:ok?today0()+INT[b]*DAY:0};
  save();Q.shift();if(!ok)Q.push(c.id);
  stage=0;srcOpen=false;render();
}
function viewFilter(){
  const m={};S.cards.forEach(c=>{const l=lessonOf(c);(m[l]=m[l]||{n:0,d:0});m[l].n++;if(P(c).due<=Date.now())m[l].d++;});
  let h=`<div class="panel mute">درس‌های انتخاب‌شده در اولویت مرور قرار می‌گیرند و فقط از آن‌ها سؤال می‌شود؛ پیشرفت بقیه دست‌نخورده می‌ماند. اگر هیچ درسی انتخاب نشود، همه کارت‌ها نمایش داده می‌شوند.</div>`;
  h+=`<div style="margin-bottom:10px"><button class="btn ghost" data-act="clearf">نمایش همه دروس</button></div>`;
  Object.keys(m).forEach(l=>{
    const on=S.filter.includes(l);
    h+=`<div class="lrow ${on?'on':''}" data-act="lesson" data-v="${esc(l)}"><span class="dot"></span><span class="grow">${esc(l)}<div class="mute">${fa(m[l].n)} کارت · ${fa(m[l].d)} آماده مرور</div></span></div>`;
  });
  return h;
}
function lessonsList(){return [...new Set(S.cards.map(c=>c.l).filter(Boolean))];}
function chaptersList(){return [...new Set(S.cards.map(c=>c.c).filter(Boolean))];}
function viewAdd(){
  let h=`<div class="seg"><button data-act="mode" data-v="single" class="${addMode==='single'?'on':''}">تکی</button><button data-act="mode" data-v="bulk" class="${addMode==='bulk'?'on':''}">لیستی</button></div><div class="panel">`;
  if(addMode==='single'){
    h+=`<label>واژه *</label><input id="f_w"><label>معنی انگلیسی</label><input id="f_e" dir="ltr"><label>تعریف *</label><textarea id="f_d"></textarea><label>منبع</label><input id="f_s"><label>عنوان درس</label><input id="f_l" list="dl_l"><label>عنوان فصل</label><input id="f_c" list="dl_c">`;
    h+=`<datalist id="dl_l">${lessonsList().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="dl_c">${chaptersList().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
    h+=`<div style="margin-top:14px"><button class="btn" data-act="addone">افزودن کارت</button></div>`;
  }else{
    h+=`<div class="mute" style="margin-bottom:8px">ردیف‌ها را مستقیم از اکسل کپی و اینجا جای‌گذاری کنید. ترتیب ستون‌ها: واژه، انگلیسی، تعریف، منبع، عنوان درس، عنوان فصل. سطر عنوان (واژه…) خودکار نادیده گرفته می‌شود و واژه‌های تکراری در همان درس اضافه نمی‌شوند.</div><textarea id="bulk" style="min-height:220px"></textarea><div style="margin-top:14px"><button class="btn" data-act="addbulk">افزودن لیست</button></div>`;
  }
  return h+`</div>`;
}
function parseTSV(t){
  if(!t.includes('\t')&&t.includes('|'))return t.split(/\r?\n/).map(l=>l.split('|')).filter(r=>r.some(x=>x.trim()));
  const rows=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"'&&c===''){q=true;}
    else if(ch==='\t'){row.push(c);c='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);rows.push(row);row=[];c='';}
    else c+=ch;}
  if(c!==''||row.length){row.push(c);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function addCards(list){
  let add=0,dup=0,bad=0;
  const seen=new Set(S.cards.map(c=>c.w.trim()+'|'+(c.l||'').trim()));
  list.forEach(r=>{
    const x={w:(r[0]||'').trim(),e:(r[1]||'').trim(),d:(r[2]||'').trim(),s:(r[3]||'').trim(),l:(r[4]||'').trim(),c:(r[5]||'').trim()};
    if(!x.w||!x.d){bad++;return;}
    const k=x.w+'|'+x.l;if(seen.has(k)){dup++;return;}
    seen.add(k);x.id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.cards.push(x);add++;
  });
  if(add){save();buildQueue();}
  return {add,dup,bad};
}
function report(r){toast(`${fa(r.add)} کارت اضافه شد`+(r.dup?` · ${fa(r.dup)} تکراری`:'')+(r.bad?` · ${fa(r.bad)} ردیف ناقص`:''));}
function viewCards(){
  return `<input id="q" placeholder="جستجو در واژه، انگلیسی یا تعریف" value="${esc(search)}"><div class="panel" style="margin-top:10px"><div id="list"></div></div>
  <div class="panel"><div class="mute" style="margin-bottom:8px">همهٔ کارت‌ها به جعبهٔ ۱ برمی‌گردند (کارت‌ها حذف نمی‌شوند).</div><button class="btn ${resetArm?'warn':'ghost'}" data-act="reset">${resetArm?'برای تأیید دوباره لمس کنید':'بازنشانی پیشرفت'}</button></div>`;
}
function renderList(){
  const q=search.trim().toLowerCase();
  const arr=S.cards.filter(c=>!q||(c.w+' '+c.e+' '+c.d).toLowerCase().includes(q));
  $('#list').innerHTML=arr.length?arr.map(c=>`<div class="item"><div class="grow"><div class="t">${esc(c.w)}</div><div class="mute">${esc(lessonOf(c))}</div></div><span class="badge">جعبه ${fa(P(c).b)}</span><button data-act="del" data-id="${esc(c.id)}">${delId===c.id?'تأیید حذف؟':'حذف'}</button></div>`).join(''):'<div class="mute">موردی پیدا نشد.</div>';
}
function render(){
  renderHeader();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===tab));
  const v={study:viewStudy,filter:viewFilter,add:viewAdd,cards:viewCards}[tab];
  $('#view').innerHTML=v();
  if(tab==='cards'){renderList();$('#q').addEventListener('input',e=>{search=e.target.value;renderList();});}
}
function go(t){tab=t;delId=null;resetArm=false;if(t==='study'&&!Q.length)buildQueue();render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,v=a.dataset.v;
  if(act==='card'){if(stage<2){const c=cur();stage=(stage===0&&c&&c.e)?1:2;render();}}
  else if(act==='yes')answer(true);
  else if(act==='no')answer(false);
  else if(act==='src'){srcOpen=!srcOpen;render();}
  else if(act==='ahead'){buildQueue(true);render();}
  else if(act==='lesson'){const i=S.filter.indexOf(v);if(i<0)S.filter.push(v);else S.filter.splice(i,1);save();buildQueue();render();}
  else if(act==='clearf'){S.filter=[];save();buildQueue();render();}
  else if(act==='mode'){addMode=v;render();}
  else if(act==='addone'){
    const g=id=>$('#'+id).value;
    const r=addCards([[g('f_w'),g('f_e'),g('f_d'),g('f_s'),g('f_l'),g('f_c')]]);
    if(r.add){render();}
    report(r);if(!r.add&&!r.dup)toast('واژه و تعریف الزامی است.');
  }
  else if(act==='addbulk'){
    let rows=parseTSV($('#bulk').value);
    if(rows.length&&rows[0][0].trim()==='واژه')rows.shift();
    if(!rows.length){toast('متنی برای افزودن وجود ندارد.');return;}
    const r=addCards(rows);if(r.add)render();report(r);
  }
  else if(act==='del'){const id=a.dataset.id;
    if(delId===id){S.cards=S.cards.filter(c=>c.id!==id);delete S.prog[id];delId=null;save();buildQueue();renderHeader();toast('حذف شد');}
    else delId=id;
    renderList();}
  else if(act==='reset'){
    if(resetArm){S.prog={};resetArm=false;save();buildQueue();render();toast('پیشرفت بازنشانی شد');}
    else{resetArm=true;render();}
  }
});
buildQueue();render();
</script>
</body>
